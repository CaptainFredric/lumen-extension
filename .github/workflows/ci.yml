name: Verify Lumen

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test backend contract
        run: npm run smoke:backend

      - name: Test local and remote reconciliation
        run: npm run smoke:sync

      - name: Test capture behavior
        run: npm run smoke:capture

      - name: Test area-monitor schedules
        run: npm run smoke:watch

      - name: Test public site routes
        run: npm run smoke:site

      - name: Validate extension package
        run: npm run smoke:package

      - name: Test exact release ZIP from a clean profile
        run: xvfb-run --auto-servernum npm run smoke:release

      - name: Test loaded extension
        run: xvfb-run --auto-servernum npm run smoke:extension

      - name: Test end-to-end capture
        run: xvfb-run --auto-servernum npm run smoke:e2e

      - name: Clean temporary browser artifacts
        if: always()
        run: npm run cleanup:tmp

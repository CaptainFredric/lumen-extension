name: Verify Lumen

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LUMEN_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.LUMEN_GOOGLE_DRIVE_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test backend contract
        run: npm run smoke:backend

      - name: Test local and remote reconciliation
        run: npm run smoke:sync

      - name: Test capture behavior
        run: npm run smoke:capture

      - name: Test difficult-site fixtures
        run: npm run smoke:difficult-sites

      - name: Test area-monitor schedules
        run: npm run smoke:watch

      - name: Test Settings and Privacy Shield
        run: xvfb-run --auto-servernum npm run smoke:settings

      - name: Test annotation editing
        run: npm run smoke:editor

      - name: Test image, PDF, and zoom export
        run: npm run smoke:export

      - name: Test export source integrity and PDF cache pruning
        run: npm run smoke:export-integrity

      - name: Test visual diff engine
        run: npm run smoke:diff

      - name: Test visual review page
        run: xvfb-run --auto-servernum npm run smoke:review

      - name: Test reviewed Drive export
        run: npm run smoke:drive

      - name: Test public site routes
        run: npm run smoke:site

      - name: Regenerate and validate Web Store screenshots
        run: xvfb-run --auto-servernum npm run store:screenshots

      - name: Upload validated Web Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lumen-store-screenshots-${{ github.sha }}
          path: store-assets/screenshots/*.png

      - name: Validate extension package
        run: npm run smoke:package

      - name: Test exact release ZIP from a clean profile
        run: xvfb-run --auto-servernum npm run smoke:release

      - name: Test loaded extension
        run: xvfb-run --auto-servernum npm run smoke:extension

      - name: Test end-to-end capture
        run: xvfb-run --auto-servernum npm run smoke:e2e

      - name: Upload exact tested extension package
        uses: actions/upload-artifact@v4
        with:
          name: lumen-extension-${{ github.sha }}
          path: dist/lumen-extension-*.zip
          if-no-files-found: error

      - name: Clean temporary browser artifacts
        if: always()
        run: npm run cleanup:tmp
